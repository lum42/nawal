<style>
:root{--paper:#eee6d3;--paper2:#e6dcc4;--ink:#483627;--soft:#6b5c4b;--rule:#b0a08a;--light:#f7f2e6;
--f:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;--s:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--s);line-height:1.5;min-height:100vh;
background-image:radial-gradient(circle at 18% 8%,rgba(255,255,255,.6),transparent 52%),radial-gradient(circle at 88% 78%,rgba(72,54,39,.1),transparent 58%)}
header{max-width:1000px;margin:0 auto;padding:26px 18px 0;position:relative}
.kicker{font-size:10.5px;letter-spacing:3px;text-transform:uppercase;color:var(--soft);font-weight:600}
h1{font-family:var(--f);font-weight:600;font-size:31px;margin:6px 0 0}
.sub{font-size:13.5px;color:var(--soft);margin:8px 0 0;max-width:66ch}
.langbtn{position:absolute;top:26px;right:18px;border:1px solid var(--rule);border-radius:20px;background:rgba(255,255,255,.5);
font-family:var(--s);font-size:11px;font-weight:700;letter-spacing:1.2px;color:var(--soft);padding:6px 11px;cursor:pointer}
.langbtn b{color:var(--ink)}
nav{display:flex;gap:2px;flex-wrap:wrap;margin:20px 0 0;border-bottom:1px solid var(--rule)}
nav button{font-family:var(--s);font-size:11.5px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;
background:none;border:0;border-bottom:2px solid transparent;color:var(--soft);padding:10px 13px;cursor:pointer}
nav button:hover{color:var(--ink);background:rgba(72,54,39,.05)}
nav button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--ink)}
main{max-width:1000px;margin:0 auto;padding:24px 18px 64px}
section{display:none}section.on{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.card{background:linear-gradient(180deg,var(--light),var(--paper2));border:1px solid var(--rule);border-radius:14px;
padding:22px;box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 2px 10px rgba(72,54,39,.07)}
.card.tight{padding:16px 18px}
.rowline{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=date]{font-family:var(--s);font-size:15px;padding:10px 12px;border-radius:9px;border:1px solid var(--rule);background:var(--light);color:var(--ink)}
.btn{font-family:var(--s);font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:10px 15px;
border-radius:9px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer}
.btn.ghost{background:none;color:var(--ink)}.btn:active{transform:translateY(1px)}
.nm{font-size:10.5px;letter-spacing:2.4px;text-transform:uppercase;color:var(--soft);font-weight:700}
.sign{font-family:var(--f);font-size:44px;letter-spacing:6px;text-transform:uppercase;margin:10px 0 2px;line-height:1.05}
.kw{font-family:var(--f);font-size:17px;color:#6d5a45;margin:0;font-style:italic}
.meta{font-size:12px;color:var(--soft)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
@media(max-width:760px){.split{grid-template-columns:1fr}h1{font-size:26px}.langbtn{position:static;margin-top:14px}.btn,nav button,.langbtn{min-height:44px;display:inline-flex;align-items:center;justify-content:center}}
dl{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:16px 0 0;font-size:13.5px}
dt{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--soft);font-weight:700;padding-top:3px;white-space:nowrap}
dd{margin:0}hr{border:0;border-top:1px solid var(--rule);margin:16px 0}
.langs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.lang{border:1px solid var(--rule);border-radius:8px;padding:5px 8px;font-size:11.5px;background:rgba(255,255,255,.4)}
.lang b{font-family:var(--f);font-size:13px;font-weight:600;display:block}
.lang i{font-style:normal;font-size:9.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--soft)}
table{border-collapse:collapse;width:100%;font-size:12px;background:rgba(255,255,255,.35)}
th,td{text-align:left;padding:7px;border-bottom:1px solid rgba(176,160,138,.55);vertical-align:top;white-space:nowrap}
thead th{position:sticky;top:0;background:var(--paper);z-index:1;font-size:10px;letter-spacing:.8px;text-transform:uppercase;
color:var(--soft);border-bottom:1.5px solid var(--ink)}
tbody tr:hover{background:rgba(72,54,39,.05)}
td.n{font-family:var(--f);color:#7d5f3c}
.sector{cursor:pointer}
.sector:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.sector text{pointer-events:none}
.scroll{overflow-x:auto;border:1px solid var(--rule);border-radius:10px}
.scroll td:first-child,.scroll th:first-child{position:sticky;left:0;background:var(--paper);z-index:2}
.bridge{border:1px solid var(--rule);border-left:3px solid #a4552f;border-radius:10px;padding:15px 17px;margin:0 0 12px;background:rgba(255,255,255,.4)}
.bridge h3{font-family:var(--f);font-size:18.5px;margin:0 0 6px;font-weight:600}
.bridge p{margin:0 0 7px;font-size:13.5px}
.pill{display:inline-block;font-family:var(--f);font-size:12.5px;padding:2px 8px;border-radius:5px;background:rgba(72,54,39,.09);margin:2px 3px 0 0}
.src{padding:0;margin:18px 0 0}.src li{list-style:none;margin:0 0 9px;font-size:12.5px}
.tier{font-size:9.5px;font-weight:700;letter-spacing:.6px;padding:1px 5px;border-radius:4px;margin-right:6px;background:#40695a;color:#fff}
.tier.b{background:#8a6114}.tier.c{background:#a4552f}
a{color:#7a4a2b}
.note{background:rgba(164,85,47,.09);border:1px solid rgba(164,85,47,.3);border-radius:10px;padding:13px 15px;font-size:13px;margin:0 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.mini{border:1px solid var(--rule);border-radius:9px;padding:10px 12px;background:rgba(255,255,255,.4)}
.mini b{font-family:var(--f);font-size:15px;display:block}
.mini span{font-size:11px;color:var(--soft)}
footer{max-width:1000px;margin:0 auto;padding:0 18px 40px;font-size:11px;color:var(--soft)}
</style>
</head>
<body>
<header>
  <button class="langbtn" id="lang" aria-label="Language">ES · <b>EN</b></button>
  <div class="kicker" data-t="kicker"></div>
  <h1 data-t="h1"></h1>
  <p class="sub" data-t="sub"></p>
  <nav id="nav" aria-label="Secciones"></nav>
</header>
<main>
  <section id="v-calc" class="on">
    <div class="card tight" style="margin-bottom:18px">
      <div class="rowline">
        <input type="date" id="date" aria-label="Date" data-t-a="date">
        <button class="btn" id="go" data-t="go"></button>
        <button class="btn ghost" id="today" data-t="today"></button>
        <button class="btn ghost" id="share" data-t="share"></button>
      </div>
      <p class="meta" style="margin:10px 0 0" data-t="calcNote"></p>
      <p class="meta" id="shareOut" aria-live="polite" style="margin:4px 0 0"></p>
    </div>
    <div class="split"><div class="card" id="calcCard" aria-live="polite"></div><div id="calcSide"></div></div>
  </section>
  <section id="v-wheel">
    <p class="meta" style="margin:0 0 16px" data-t="wheelHint"></p>
    <div class="split">
      <div><svg id="wheel" viewBox="0 0 640 640" role="img" aria-label="Wheel of the twenty days"></svg></div>
      <div id="detail" aria-live="polite"></div>
    </div>
  </section>
  <section id="v-names">
    <div class="note"><b data-t="namesHead"></b> <span data-t="namesBody"></span></div>
    <div class="scroll"><table id="nametable"></table></div>
    <p class="meta" style="margin-top:12px" data-t="namesFoot"></p>
  </section>
  <section id="v-bridges">
    <div class="note"><b data-t="bridgeHead"></b> <span data-t="bridgeBody"></span></div>
    <div id="bridges"></div>
  </section>
  <section id="v-src">
    <h2 style="font-family:var(--f);font-weight:600;margin:0 0 14px" data-t="srcH2"></h2>
    <div class="note"><b data-t="elemHead"></b> <span data-t="elemBody"></span></div>
    <div id="coverage"></div>
    <ul class="src" id="srclist"></ul>
  </section>
</main>
<footer><span data-t="foot"></span></footer>
<script>

   input feeds toLocaleDateString (text only); nothing user-supplied is inserted as markup. */
const DAYS = [{"seq": 1, "kiche": "Imox", "yuc": "Imix", "kaq": "Ymox", "chuj": "Imox", "qan": "Imox", "nah": "Cipactli", "glyph": "Primordial water serpent / crocodilian earth; the undulating band of water", "classic": "Ha' (?)", "force": "Water — sea, river, lake; also the hidden and the disordered", "animal": "— (water serpent, not an animal companion)", "office": "—", "kt": "Etymology 'sea / river / lake'. Ritual day to ask for rain and for the return of someone who has left; also to calm mental and spiritual disorder and problems at home. Those born on it: good workers, intuitive, creative.", "div": "Bad, dangerous day: 'the hidden forces in the universe made manifest in insanity'. Divinations in 7 Ajpu, 8 Imox, 9 Iq' point to confusion about the idols of the house. Daykeepers pray against enemies.", "note": "Imox/Imix is the most transparent of many cognates shared by K'iche' and Yucatec — compare Iq'/Ik', Kame/Kimi, Kawoq/Kawak, Ajpu'/Ajaw.", "names": {"kiche": "Imox", "kaq1685": "Ymox", "yuc": "Imix", "mam": "Iimx", "ixil": "Imux", "poqom": "Imox", "protochol": "Na-Chan", "tzeltal": "Imox", "chicomu": "Imox", "chuj": "Himox", "jak": "Imox", "qan": "Imox", "nah": "Cipactli"}, "classic_alt": "Imix (?) / Ha' (?)", "es": {"force": "Agua: mar, río, lago. También lo oculto y lo desordenado", "animal": "— (serpiente de agua, no es animal compañero)", "office": "—", "kt": "Etimología: mar, río, lago. Día para pedir lluvia y el regreso de quien se fue; también para calmar desórdenes mentales y espirituales y problemas en la casa. Quienes nacen en él: buenos trabajadores, intuitivos, creativos.", "div": "Día malo y peligroso: las fuerzas ocultas del universo manifiestas en la locura. Las adivinaciones en 7 Ajpu, 8 Imox y 9 Iq' señalan confusión sobre los ídolos de la casa. Los ajq'ijab rezan contra los enemigos.", "note": "Imox/Imix es el más transparente de muchos cognados entre k'iche' y yucateco: compárese Iq'/Ik', Kame/Kimi, Kawoq/Kawak, Ajpu'/Ajaw.", "glyph": "Serpiente de agua primordial / tierra cocodriliana; la banda ondulante del agua"}}, {"seq": 2, "kiche": "Iq'", "yuc": "Ik'", "kaq": "Yε (Ye')", "chuj": "Ik'", "qan": "Iq'", "nah": "Ehecatl", "glyph": "Wind, breath, life force", "classic": "Ik'", "force": "Air — wind, breath, spirit; heavy rain and hurricanes", "animal": "—", "office": "—", "kt": "Etymology 'wind, air, spirit, heart of the sky'; also means heavy showers and hurricanes. People ask for the end of suffering, illness or trouble at home. Those born on it: emotional, sociable, considerate.", "div": "Bad day: the destructive forces of the universe, embodied in the stone idols, which must be honoured with incense, aguardiente, roses, pine needles and candles. Painful swellings and cancer are attributed to it.", "note": "Also the year-bearer white (chilam/Ab' cycle): 'the colour of the nawal Iq' is white' — Guatemalan Ministry of Culture, Armonización Maya.", "names": {"kiche": "Iq'", "kaq1685": "Yε (Ye')", "yuc": "Ik", "mam": "Iiq'", "ixil": "I'q'", "poqom": "Iiq'", "protochol": "Ik'", "tzeltal": "Ik'", "chicomu": "I'q'", "chuj": "Ik'", "jak": "Iq'", "qan": "Iq'", "nah": "Ehecatl"}, "classic_alt": "", "es": {"force": "Aire: viento, aliento, espíritu; aguaceros y huracanes", "animal": "—", "office": "—", "kt": "Etimología: viento, aire, espíritu, corazón del cielo; también aguacero y huracán. Se pide el fin del sufrimiento, la enfermedad o los problemas de la casa. Quienes nacen en él: emotivos, sociables, considerados.", "div": "Día malo: las fuerzas destructivas del universo, encarnadas en los ídolos de piedra, que deben honrarse con incienso, aguardiente, rosas, pino y velas. Se le atribuyen hinchazones dolorosas y cáncer.", "note": "También es cargador del año blanco: el color del nawal Iq' es el blanco (Ministerio de Cultura).", "glyph": "Viento, aliento, fuerza vital"}}, {"seq": 3, "kiche": "Aq'ab'al", "yuc": "Ak'bal", "kaq": "Aεbal", "chuj": "Woton", "qan": "Watan", "nah": "Calli", "glyph": "Darkness, night, early dawn", "classic": "Ak'ab (?)", "force": "Night and dawn — the dark that precedes light; the heart's feelings", "animal": "—", "office": "—", "kt": "Etymology 'darkness'; means dawn and hand — the light of dawn and the dark. Day to ask that light reach all things; the day for feelings of the heart. Those born on it: brave hunters, humble, serious, precise, able to withstand criticism.", "div": "Bad day, the day of slanderers. 8 Aq'ab'al is the time to ask protection against slander; 12 and 13 are strong days for working harm against others and for requesting that enemies be punished.", "note": "Chuj/Q'anjob'al keep a distinct root (Woton/Watan), not a cognate of Aq'ab'al.", "names": {"kiche": "Aq'ab'al", "kaq1685": "Aεbal", "yuc": "Akbal", "mam": "Aq'b'aal", "ixil": "Aq'b'al", "poqom": "Aq'ab'al", "protochol": "Wotan", "tzeltal": "Wotan", "chicomu": "Votan", "chuj": "Woton", "jak": "Watan", "qan": "Watanh", "nah": "Calli"}, "classic_alt": "Ak'b'al (?)", "es": {"force": "Noche y amanecer: la oscuridad que precede a la luz; los sentimientos del corazón", "animal": "—", "office": "—", "kt": "Etimología: oscuridad; significa amanecer y mano, la luz del alba y lo oscuro. Día para pedir que la claridad llegue a todas las cosas; el día de los sentimientos del corazón. Quienes nacen en él: cazadores valientes, humildes, serios, precisos.", "div": "Día malo, el día de los calumniadores. 8 Aq'ab'al es momento de pedir protección contra la calumnia; 12 y 13 son días fuertes para obrar mal contra otros y para pedir castigo para los enemigos.", "note": "Chuj y q'anjob'al conservan una raíz distinta (Woton/Watan), no cognada de Aq'ab'al.", "glyph": "Oscuridad, noche, amanecer temprano"}}, {"seq": 4, "kiche": "K'at", "yuc": "Kan", "kaq": "Kat", "chuj": "K'ana", "qan": "K'ana'", "nah": "Cuetzpalin", "glyph": "Ripe maize, yellow, abundance (Yucatec k'an); the net and fire are K'iche' K'at", "classic": "Ohl (?)", "force": "Ripe maize and ripeness (k'an) — in K'iche', the net, the tangle, fire", "animal": "—", "office": "—", "kt": "Etymology (K'iche'): net, tangle, disentangle; the symbol of fire, the fishing net and the net that guards the maize. Day to ask for a child to be born. Those born on it promote laws theoretical and practical, and gravitate toward fire. Yucatec reads the same slot as k'an, ripe/yellow maize.", "div": "Bad day, symbolic of evil in general. 7 Aq'ab'al and 8 K'at are the days to pray for protection against the envy of others.", "note": "FALSE FRIEND: colonial orthography writes slot 4 as 'Kan', which is k'an — 'ripe, yellow maize' — not kan, 'serpent'. The serpent is slot 5 in every tradition (Yucatec Chikchan, K'iche' Kan). What differs at slot 4 is the word: K'iche' K'at 'net' against Yucatec K'an 'ripe maize'.", "names": {"kiche": "K'at", "kaq1685": "Kat", "yuc": "K'an", "mam": "K'ach", "ixil": "K'ach", "poqom": "K'aat", "protochol": "K'anan", "tzeltal": "K'anan", "chicomu": "Khanan / Ghanan", "chuj": "K'ana'", "jak": "K'ana'", "qan": "K'ana'", "nah": "Cuetzpalin"}, "classic_alt": "K'an (?)", "es": {"force": "Fuego y red: lo que arde, la red de pesca, la red que protege el maíz", "animal": "—", "office": "—", "kt": "Etimología: red, enredo, desenredo. Símbolo del fuego, de la quema, de la red de pesca y de la red que guarda las mazorcas. Día para pedir que nazca un niño. Quienes nacen en él promueven leyes teóricas y prácticas, son buenos, débiles y tienden al fuego.", "div": "Día malo, símbolo del mal en general. 7 Aq'ab'al y 8 K'at son días para pedir protección contra la envidia ajena.", "note": "TRAMPA DE POSICIÓN: el k'iche' K'at ocupa el puesto 4 donde el yucateco tiene Kan (serpiente). El Ministerio de Cultura lo llama «juego K'at/Kan».", "glyph": "Maíz maduro, amarillo, abundancia (k'an yucateco); la red y el fuego son el K'at k'iche'"}}, {"seq": 5, "kiche": "Kan", "yuc": "Chikchan", "kaq": "Can", "chuj": "Ab'ak", "qan": "Ab'ak", "nah": "Coatl", "glyph": "Cosmological snake", "classic": "—", "force": "The serpent — 'feathered serpent', framer and shaper; justice, truth, peace", "animal": "Serpent", "office": "—", "kt": "Etymology 'feathered serpent'. It is the Framer and Shaper of the universe; means justice, truth and peace. People ask for strength, health and work; a day to shed anger. Those born on it: strong, skilful, wise, sincere.", "div": "Bad day that brings sickness; symbolic of the arbitrary cruelty of the universe.", "note": "The pairing with Yucatec Chicchan confirms the offset: it is the *pair* K'at/Kan that moves, not one sign.", "names": {"kiche": "Kan", "kaq1685": "Can", "yuc": "Chicchan", "mam": "Kaan", "ixil": "Kan", "poqom": "Ka'n", "protochol": "Cha'k-Chan", "tzeltal": "Ab'ak", "chicomu": "Abakh / Abagh", "chuj": "Ab'ak", "jak": "Ab'ak", "qan": "Ab'ak", "nah": "Coatl"}, "classic_alt": "", "es": {"force": "La serpiente: «serpiente emplumada», formadora y modeladora; justicia, verdad, paz", "animal": "Serpiente", "office": "—", "kt": "Etimología: serpiente emplumada. Es el Formador y Modelador del universo; significa justicia, verdad y paz. Se pide fuerza, salud y trabajo; día para soltar el enojo. Quienes nacen en él: fuertes, hábiles, sabios, sinceros.", "div": "Día malo que trae enfermedad; símbolo de la crueldad arbitraria del universo.", "note": "El par con Chicchan yucateco confirma el desfase: lo que se mueve es el par K'at/Kan, no un solo signo.", "glyph": "Serpiente cosmológica"}}, {"seq": 6, "kiche": "Kame", "yuc": "Kimi", "kaq": "Camey", "chuj": "Tox", "qan": "Tox", "nah": "Miquiztli", "glyph": "Death", "classic": "Cham (?)", "force": "Death — and the ancestors; the owl that announces death from the trees", "animal": "Owl (herald of death)", "office": "Ancestors", "kt": "Etymology 'death'; encompasses the good and the bad. Nawal of the sun; means death and the owl that announces it from the trees. People ask to be free of bad choices and accidents. Those born on it: strong, and they suffer a great deal.", "div": "Symbolic of the ultimate dissolution of all things in death; the day above all others for forgiveness and pardon. Bunzel notes that for some it is a good day, because it means one's evil deeds will be forgiven and sickness will pass.", "note": "Chuj/Q'anjob'al Tox is a separate root for the same slot.", "names": {"kiche": "Kame", "kaq1685": "Camey", "yuc": "Cimi", "mam": "Kameey", "ixil": "Kamel", "poqom": "Kemeeh", "protochol": "Tox", "tzeltal": "Tox", "chicomu": "Tox", "chuj": "Tox", "jak": "Tox", "qan": "Tox", "nah": "Miquiztli"}, "classic_alt": "", "es": {"force": "La muerte, y los antepasados; la lechuza que anuncia la muerte desde los árboles", "animal": "Lechuza (anuncio de muerte)", "office": "Los antepasados", "kt": "Etimología: muerte; abarca lo bueno y lo malo. Nawal del sol; significa muerte y la lechuza que la anuncia. Se pide librarse de malas decisiones y accidentes. Quienes nacen en él: fuertes, y sufren mucho.", "div": "Símbolo de la disolución final de todo, lo bueno y lo malo, en la muerte; el día por excelencia para el perdón. Bunzel anota que para algunos es buen día, porque anuncia el perdón de las culpas y el fin de la enfermedad.", "note": "Tox, en chuj y q'anjob'al, es una raíz distinta para el mismo puesto.", "glyph": "Muerte"}}, {"seq": 7, "kiche": "Kej", "yuc": "Manik'", "kaq": "Quieh", "chuj": "Kej/Chej", "qan": "Chej", "nah": "Mazatl", "glyph": "Deer", "classic": "Chij (?)", "force": "Earth and sky held up — the four supports and the four corners", "animal": "Deer", "office": "—", "kt": "Etymology 'deer'. One of the four supports of sky and earth; the force that carries human destinies; the four corners, in K'iche' Tojil, Avilix, Aja Bitz and Majukutaj. Those born on it defend other people, are irritable, resist illness.", "div": "Good day above all others for requesting favours; it symbolizes transfiguration and fulfilment in death as manifested in the ancestors. 8 Kej is the day of commemoration of the ancestors.", "note": "Also a year-bearer, with the colour black in the Dresden new-year pages.", "names": {"kiche": "Kej", "kaq1685": "Quieh", "yuc": "Manik", "mam": "Kyeej", "ixil": "Cheh", "poqom": "Keej", "protochol": "Manich'", "tzeltal": "Moxic", "chicomu": "Moxic", "chuj": "Kej", "jak": "Chej", "qan": "Cheh", "nah": "Mazatl"}, "classic_alt": "", "es": {"force": "Tierra y cielo sostenidos: los cuatro apoyos y las cuatro esquinas", "animal": "Venado", "office": "—", "kt": "Etimología: venado. Uno de los cuatro sostenes del cielo y la tierra; la fuerza que carga los destinos humanos; las cuatro esquinas, en k'iche' Tojil, Avilix, Aja Bitz y Majukutaj. Quienes nacen en él defienden a otros, son irritables y resisten la enfermedad.", "div": "Buen día, el mejor para pedir favores; símbolo de la transfiguración y el cumplimiento en la muerte manifestados en los antepasados. 8 Kej es el día de conmemoración de los antepasados.", "note": "También es cargador del año, negro en las páginas de año nuevo del Códice de Dresde.", "glyph": "Venado"}}, {"seq": 8, "kiche": "Q'anil", "yuc": "Lamat", "kaq": "Kanel", "chuj": "Lamb'at", "qan": "Lamb'at", "nah": "Tochtli", "glyph": "Venus, star, ripeness, maize seed", "classic": "Ek' / Lamaht (?)", "force": "Seed and maize — the yellow of ripe maize; the four seasons; plants, animals, people", "animal": "—", "office": "—", "kt": "Etymology 'seed' and 'yellow'; the colour of gold and cane, the third colour of the sun; symbol of the four seasons and of humans, animals and plants. Those born on it speak of what they lack and what they are not; they suffer a lot and need moral support.", "div": "Good day, sacred to the spirits of agriculture; on it are supplicated all things that serve human sustenance. A good day symbolic of the regeneration of the earth and rebirth after death, seen in the growth of corn. It is the day of the milpa; after harvest one waits for Q'anil to give thanks.", "note": "CLEAREST DIVERGENCE: Aztec/Yucatec gloss is Rabbit (Tochtli/Lamat), K'iche' is Seed/Maize (Q'anil), Classic glyph reads Venus star. Three different readings of one slot.", "names": {"kiche": "Q'anil", "kaq1685": "Kanel", "yuc": "Lamat", "mam": "Q'aniil / Q'aneel", "ixil": "Q'anil", "poqom": "Q'aniil", "protochol": "Lam(b')at", "tzeltal": "Lamat", "chicomu": "Lambat", "chuj": "Lanhb'at", "jak": "Lamb'at", "qan": "Q'anil", "nah": "Tochtli"}, "classic_alt": "", "es": {"force": "Semilla y maíz: el amarillo del maíz maduro; las cuatro estaciones; plantas, animales y personas", "animal": "—", "office": "—", "kt": "Etimología: semilla y amarillo; el color del oro y de la caña, el tercer color del sol; símbolo de las cuatro estaciones y de humanos, animales y plantas. Quienes nacen en él hablan de lo que no tienen y de lo que no son; sufren mucho y necesitan apoyo moral.", "div": "Buen día, consagrado a los espíritus de la agricultura; en él se suplica por todo lo que sostiene la vida. Símbolo de la regeneración de la tierra y del renacer tras la muerte, visible en el crecimiento del maíz: es el día de la milpa, y tras la cosecha se espera Q'anil para agradecer.", "note": "DIVERGENCIA MÁS CLARA: la glosa mexica y yucateca es conejo (Tochtli/Lamat); el k'iche' es semilla y maíz (Q'anil); el glifo clásico se lee Venus. Tres lecturas de un puesto.", "glyph": "Venus, estrella, madurez, semilla de maíz"}}, {"seq": 9, "kiche": "Toj", "yuc": "Muluk", "kaq": "Toh", "chuj": "Mulu'", "qan": "Mulu'", "nah": "Atl", "glyph": "Jade, water, offering", "classic": "—", "force": "Fire and water together — offering, debt, payment; the nawal of fire", "animal": "—", "office": "Debts and offerings", "kt": "Etymology 'offering, fine, payment', also 'help, socialise, listen, understand'. People ask for strength to avoid mistakes and the end of suffering; it is the nawal of fire. People ask that dark things come into the light. Those born on it: conciliators, self-taught, good in psychology and morals.", "div": "Bad day, a day of sickness, symbolizing the suffering caused by sin; also the day for calling sickness to punish an enemy.", "note": "K'iche' reads the slot as debt/offering; Yucatec Muluk is jade/water; Aztec Atl is water. Same slot, different axis.", "names": {"kiche": "Toj", "kaq1685": "Toh", "yuc": "Muluc", "mam": "Chooj", "ixil": "Choh", "poqom": "Tooj", "protochol": "Mulu(k)", "tzeltal": "Mul", "chicomu": "Mulu", "chuj": "Mulu", "jak": "Mulu'", "qan": "Mulu'", "nah": "Atl"}, "classic_alt": "", "es": {"force": "Fuego y agua a la vez: ofrenda, deuda, pago; el nawal del fuego", "animal": "—", "office": "Deudas y ofrendas", "kt": "Etimología: ofrenda, multa, pago; también ayudar, socializar, escuchar, entender. Se pide fuerza para no equivocarse y el fin del sufrimiento; es el nawal del fuego. Se pide que lo oscuro salga a la luz. Quienes nacen en él: conciliadores, autodidactas.", "div": "Día malo, día de enfermedad, símbolo del sufrimiento causado por el pecado; también el día para llamar enfermedad contra un enemigo.", "note": "El k'iche' lee deuda y ofrenda; el yucateco Muluk es jade y agua; el mexica Atl es agua. Mismo puesto, otro eje.", "glyph": "Jade, agua, ofrenda"}}, {"seq": 10, "kiche": "Tz'i'", "yuc": "Ok", "kaq": "Tzij", "chuj": "Elab'", "qan": "Elab'", "nah": "Itzcuintli", "glyph": "Dog", "classic": "Ook (?)", "force": "The dog — the five senses; material and spiritual justice", "animal": "Dog", "office": "Law and the judge", "kt": "Etymology 'dog'; it represents the five senses of human beings. People ask to keep away poverty, misfortune and bad habits; it is the nawal of material and spiritual justice, and one can ask to judge good and bad and be free of criticism. Those born on it: intelligent and jealous.", "div": "An evil day symbolizing sin, especially sexual impurity. There are no ceremonies on this day because it is evil.", "note": "—", "names": {"kiche": "Tz'i'", "kaq1685": "Tzij", "yuc": "Oc", "mam": "Tx'i'", "ixil": "Tx'i'", "poqom": "Tz'i'", "protochol": "Ok", "tzeltal": "Uk", "chicomu": "Elab", "chuj": "Elab'", "jak": "Elab'", "qan": "Elab'", "nah": "Itzcuintli"}, "classic_alt": "", "es": {"force": "El perro: los cinco sentidos; la justicia material y espiritual", "animal": "Perro", "office": "La ley y el juez", "kt": "Etimología: perro; representa los cinco sentidos del ser humano. Se pide alejar la pobreza, la desgracia y los malos hábitos; es el nawal de la justicia material y espiritual. Quienes nacen en él: inteligentes y celosos.", "div": "Día malo, símbolo del pecado, sobre todo de la impureza sexual. No se hacen ceremonias en este día porque es malo.", "note": "—", "glyph": "Perro"}}, {"seq": 11, "kiche": "B'atz'", "yuc": "Chuwen", "kaq": "Batz", "chuj": "B'a'atz'", "qan": "B'atz", "nah": "Ozomahtli", "glyph": "Howler monkey", "classic": "—", "force": "Thread and time — destiny, continuity with the past, the arts", "animal": "Monkey", "office": "Daykeeper — the lineage of time", "kt": "Etymology 'thread'. It symbolizes people's destiny and continuity with the past; the thread of time and of the development of humankind and nature. New Year ceremonies fall on this day, and new daykeepers (ajq'ijab) are initiated. Those born on it: successful in business and marriage, respectable, sociable, defenders, teachers.", "div": "A bad day in the 1854 calendar, on which sickness — especially paralysis — is prayed onto enemies; but a good day symbolizing continuity with the past and the ancestors.", "note": "Komon Tohil begins its table here, not at Imox — the ceremonial entry point of the count.", "names": {"kiche": "B'atz'", "kaq1685": "Batz", "yuc": "Chuen", "mam": "B'atz'", "ixil": "B'a'tz'", "poqom": "B'aatz'", "protochol": "B'atz'", "tzeltal": "B'atz'", "chicomu": "Batz", "chuj": "B'a'atz'", "jak": "B'atz'", "qan": "B'atz'", "nah": "Ozomahtli"}, "classic_alt": "", "es": {"force": "Hilo y tiempo: destino, continuidad con el pasado, las artes", "animal": "Mono", "office": "El contador de los días — el linaje del tiempo", "kt": "Etimología: hilo. Simboliza el destino de las personas y la continuidad con el pasado; el hilo del tiempo y del desarrollo humano y de la naturaleza. En este día caen las ceremonias de año nuevo y se inician nuevos ajq'ijab. Quienes nacen en él: prósperos en negocios y matrimonio, respetables, sociables, defensores, maestros.", "div": "Día malo en el calendario de 1854, en el que se reza para que la enfermedad —sobre todo la parálisis— caiga sobre los enemigos; pero buen día como símbolo de la continuidad con el pasado y los antepasados.", "note": "Komon Tohil empieza su tabla aquí, no en Imox: es la entrada ceremonial de la cuenta.", "glyph": "Mono aullador"}}, {"seq": 12, "kiche": "E", "yuc": "Eb'", "kaq": "Ee", "chuj": "Eyub'", "qan": "Eyub'", "nah": "Malinalli", "glyph": "Rain; road and tooth (Yucatec eb = 'tooth')", "classic": "—", "force": "The road — destiny as the day of birth; the path and the tooth", "animal": "—", "office": "—", "kt": "Etymology 'path'. On this day a man may ask for a woman's hand in marriage; it is a day to ask for someone's physical and moral wellbeing, when the ancestors are ready to listen. Those born on it: sociable, good travellers, generous.", "div": "Good day: marriage contracts are entered into on it, preceded by many sacrifices to the benign powers. Symbolic of destiny as embodied in the day of birth, one's personality and fortune.", "note": "A year-bearer; yellow in the Dresden new-year pages.", "names": {"kiche": "E", "kaq1685": "Ee", "yuc": "Eb", "mam": "Ee'", "ixil": "Eh", "poqom": "Eeh", "protochol": "Eb", "tzeltal": "Ewab'", "chicomu": "Evob", "chuj": "Eyub'", "jak": "Awnub'", "qan": "Ewub'", "nah": "Malinalli"}, "classic_alt": "", "es": {"force": "El camino: el destino tal como se fija en el día del nacimiento; la senda y el diente", "animal": "—", "office": "—", "kt": "Etimología: camino. En este día un hombre puede pedir la mano de una mujer; es día para pedir el bienestar físico y moral de alguien, cuando los antepasados están dispuestos a escuchar. Quienes nacen en él: sociables, buenos viajeros, generosos.", "div": "Buen día: en él se pactan matrimonios, precedidos de sacrificios a las potencias benignas. Símbolo del destino encarnado en el día del nacimiento, en la personalidad y la fortuna.", "note": "También es cargador del año; amarillo en las páginas de año nuevo del Códice de Dresde.", "glyph": "Lluvia; también «diente» en yucateco"}}, {"seq": 13, "kiche": "Aj", "yuc": "B'en", "kaq": "Ah", "chuj": "B'e'en", "qan": "B'en", "nah": "Acatl", "glyph": "Green / young maize, seed (reed)", "classic": "—", "force": "Maize and the house — cane, milpa, corn, children, the household", "animal": "—", "office": "The staff — office itself", "kt": "Etymology 'cane plantation' and 'milpa'; Aj means 'corn' and is a rod of divine virtues. A very meaningful day, a day of triumph. Those born on it are very lucky, calm, intelligent, sometimes moody.", "div": "Good day, consecrated to the gods of agriculture and of flocks and domestic animals; symbolic of destiny as embodied in the nawal — the day of one's destiny.", "note": "Slot 13 is reed in both branches: Yucatec b'en, highland aj, Nahuatl acatl. K'iche' aj also means young ear of maize (a separate homophone), which is where the modern maize reading comes from.", "names": {"kiche": "Aj", "kaq1685": "Ah", "yuc": "Ben", "mam": "Aaj", "ixil": "Ah", "poqom": "Aaj", "protochol": "B'in", "tzeltal": "B'en", "chicomu": "B'e'n", "chuj": "B'e'en", "jak": "B'en", "qan": "Ah", "nah": "Acatl"}, "classic_alt": "", "es": {"force": "Maíz y casa: caña, milpa, mazorca, niños, el hogar", "animal": "—", "office": "La vara — el oficio mismo", "kt": "Etimología: cañaveral y milpa; Aj significa maíz y es una vara de virtudes divinas. Día muy significativo, día de triunfo. Quienes nacen en él son muy afortunados, tranquilos, inteligentes, a veces de mal humor.", "div": "Buen día, consagrado a los dioses de la agricultura y de los rebaños y animales domésticos; símbolo del destino encarnado en el nawal: el día del propio destino.", "note": "El puesto 13 es caña en ambas ramas: b'en yucateco, aj del altiplano, acatl mexica. El aj k'iche' también significa elote tierno (homófono distinto): de ahí viene la lectura moderna del maíz.", "glyph": "Maíz tierno, semilla (caña)"}}, {"seq": 14, "kiche": "I'x", "yuc": "Ix", "kaq": "Yix (Balam)", "chuj": "Hi'ix", "qan": "Ix", "nah": "Ocelotl", "glyph": "Jaguar", "classic": "Hix (?)", "force": "Earth — the creative forces of the universe embodied in the earth; mountains and forest", "animal": "Jaguar", "office": "Altar and seer", "kt": "Etymology 'tiger' (jaguar). Its meaning is vitality, the Maya altar and wisdom; it is the sacred name of divinity on earth and the nawal of domestic animals. Those born on it: strong and vigorous.", "div": "Good day, sacred to the spirits of the mountains and forests; protection is sought for flocks and animals from the spirits who rule the wolves and other carnivorous beasts. Symbolic of the creative forces of the universe as embodied in the earth; 8 I'x and 9 Tz'ikin are days to give thanks for lodging and for land.", "note": "The 1722 K'iche' calendar glosses this day 'Yx / Balam' — two jaguar words side by side, in the same column. The 1685 Kaqchikel text has only Yix.", "names": {"kiche": "I'x", "kaq1685": "Yix", "yuc": "Ix", "mam": "I'x", "ixil": "I'x", "poqom": "I'x", "protochol": "Hix", "tzeltal": "Hix", "chicomu": "Hi'x", "chuj": "Hi'ix", "jak": "Ix", "qan": "Ix", "nah": "Ocelotl"}, "classic_alt": "", "es": {"force": "La tierra: las fuerzas creadoras del universo encarnadas en ella; montañas y bosque", "animal": "Jaguar", "office": "El altar y el vidente", "kt": "Etimología: tigre (jaguar). Significa vitalidad, el altar maya y la sabiduría; es el nombre sagrado de la divinidad en la tierra y el nawal de los animales domésticos. Quienes nacen en él: fuertes y vigorosos.", "div": "Buen día, consagrado a los espíritus de las montañas y bosques; se pide protección para los rebaños frente a los espíritus que gobiernan a los lobos y otras fieras. Símbolo de las fuerzas creadoras encarnadas en la tierra; 8 I'x y 9 Tz'ikin son días para agradecer el techo y la tierra propia.", "note": "El calendario k'iche' de 1722 glosa este día como «Yx / Balam»: dos palabras para jaguar, en la misma columna. El texto kaqchikel de 1685 sólo tiene Yix.", "glyph": "Jaguar"}}, {"seq": 15, "kiche": "Tz'ikin", "yuc": "Men", "kaq": "Tz'iquin", "chuj": "Tz'ikin", "qan": "Tz'ikin", "nah": "Cuauhtli", "glyph": "Eagle", "classic": "Tz'ikin (?)", "force": "The sky and its birds — the sun, omen, money and trade", "animal": "Bird / eagle", "office": "—", "kt": "Etymology 'bird'. It symbolizes the Creator of the universe, represented by all that is in space; also the day of money, of business and of merchants. Those born on it are good, kind and romantic.", "div": "'Most excellent of days': double offerings are made, in church and in caves, barrancas and deep woods; pardon is sought from both the Good and the Evil. The day for concluding marriage contracts and beginning important affairs. Symbolic of good luck in material affairs, including money.", "note": "K'iche' Tz'ikin = bird; Yucatec Men = eagle; Aztec Cuauhtli = eagle. Close but not identical in scope.", "names": {"kiche": "Tz'ikin", "kaq1685": "Tz'iquin", "yuc": "Men", "mam": "Tz'ikyin", "ixil": "Tz'ikyin", "poqom": "Tz'ikin", "protochol": "Men", "tzeltal": "Tz'ikin", "chicomu": "Tz'ikin", "chuj": "Tz'ikin", "jak": "Tz'ikin", "qan": "Tz'ikin", "nah": "Cuauhtli"}, "classic_alt": "Men (?)", "es": {"force": "El cielo y sus aves: el sol, el agüero, el dinero y el comercio", "animal": "Ave / águila", "office": "—", "kt": "Etimología: ave. Simboliza al Creador del universo, representado por todo lo que hay en el espacio; también es el día del dinero, de los negocios y de los comerciantes. Quienes nacen en él son buenos, amables y románticos.", "div": "«El más excelente de los días»: se hacen ofrendas dobles, en la iglesia y en cuevas, barrancas y bosques profundos; se pide perdón a las dos grandes potencias, el Bien y el Mal. Día para cerrar contratos de matrimonio e iniciar asuntos importantes. Símbolo de buena suerte material, incluido el dinero.", "note": "El k'iche' Tz'ikin es ave; el yucateco Men es águila; el mexica Cuauhtli es águila. Cercanos, no idénticos.", "glyph": "Águila"}}, {"seq": 16, "kiche": "Ajmaq", "yuc": "Kib'", "kaq": "Ahmak", "chuj": "Txab'in", "qan": "Txab'in", "nah": "Cozcacuauhtli", "glyph": "Wax (Cib); vulture in Aztec", "classic": "—", "force": "Will and error — the moral forces, prevention of mistakes", "animal": "Owl (in some highland readings)", "office": "—", "kt": "Etymology 'will'. A very special day on which people and daykeepers spend their time preventing mistakes; a day to give thanks for physical and material wellbeing. Those born on it can be temperamental and brave.", "div": "'Also a most excellent day', consecrated to the spirits presiding over good health. A day without defined character but symbolic of the moral forces embodied in penitential ritual; 7 Tz'ikin, 8 Ajmaq and 9 No'j are days to pray for protection, because evil may come from them for one's sins or evil thoughts.", "note": "K'iche' reads the slot as Will/error; Yucatec Kib' is wax; Aztec is a vulture. Three unrelated glosses.", "names": {"kiche": "Ajmaq", "kaq1685": "Ahmak", "yuc": "Cib", "mam": "Ajmaq", "ixil": "Ahmaq", "poqom": "Ajmaq", "protochol": "Cha'b'in", "tzeltal": "Chab'in", "chicomu": "Chabin", "chuj": "Chab'in", "jak": "Txab'in", "qan": "Txab'in", "nah": "Cozcacuauhtli"}, "classic_alt": "", "es": {"force": "Voluntad y falta: las fuerzas morales, la prevención del error", "animal": "Lechuza (en algunas lecturas del altiplano)", "office": "—", "kt": "Etimología: voluntad. Día muy especial en el que la gente y los ajq'ijab se ocupan de prevenir errores; día para agradecer el bienestar físico y material. Quienes nacen en él pueden ser temperamentales y valientes.", "div": "«También el function drawWheel(){
  const R=252,r=120,cx=320,cy=320;let o='';
  o+='<circle cx="'+cx+'" cy="'+cy+'" r="'+(R+5)+'" fill="none" stroke="#c3b299"/>';
  o+='<circle cx="'+cx+'" cy="'+cy+'" r="'+(r-7)+'" fill="none" stroke="#c3b299" stroke-dasharray="2 5"/>';
  const P=function(rad,a){return [cx+rad*Math.cos(a),cy+rad*Math.sin(a)];};
  DAYS.forEach(function(d,i){
    const a0=-Math.PI/2+i*Math.PI/10,a1=-Math.PI/2+(i+1)*Math.PI/10;
    const p0=P(R,a0),p1=P(R,a1),p2=P(r,a1),p3=P(r,a0);
    o+='<path class="sector" data-i="'+i+'" role="button" tabindex="0" aria-pressed="'+(i===sel)+'" '+
       'aria-label="'+d.seq+' '+d.kiche+'" d="M'+p0[0]+' '+p0[1]+' A'+R+' '+R+' 0 0 1 '+p1[0]+' '+p1[1]+
       ' L'+p2[0]+' '+p2[1]+' A'+r+' '+r+' 0 0 0 '+p3[0]+' '+p3[1]+' Z" fill="'+ACCENT[i]+
       '" fill-opacity="'+(i===sel?'.95':'.8')+'" stroke="#eee6d3" stroke-width="1.4"/>';
    const tp=P((R+r)/2+2,(a0+a1)/2);
    let rot=(a0+a1)/2*180/Math.PI+90; rot=((rot%360)+360)%360; if(rot>90&&rot<270)rot+=180;
    o+='<text x="'+tp[0]+'" y="'+tp[1]+'" text-anchor="middle" dominant-baseline="middle" transform="rotate('+rot+' '+tp[0]+' '+tp[1]+
       ')" font-family="Palatino,Georgia,serif" font-size="'+(d.kiche.length>6?12.5:15)+'" fill="#241a10">'+d.kiche+'</text>';
  });
  o+='<text x="'+cx+'" y="'+(cy+2)+'" text-anchor="middle" font-family="Georgia,serif" font-size="27" fill="#483627">'+DAYS[sel].kiche+'</text>';
  o+='<text x="'+cx+'" y="'+(cy+24)+'" text-anchor="middle" font-family="Georgia,serif" font-size="11.5" fill="#6b5c4b">'+DAYS[sel].names.yuc+' · '+DAYS[sel].nah+'</text>';
  const svg=document.getElementById('wheel');svg.innerHTML=o;
  const pick=function(e){sel=+e.currentTarget.dataset.i;drawWheel();detail();
    const el=document.querySelector('.sector[data-i="'+sel+'"]'); if(el)el.focus();};
  svg.querySelectorAll('.sector').forEach(function(e){
    e.addEventListener('click',pick);
    e.addEventListener('keydown',function(ev){
      if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();pick(ev);}
      if(ev.key==='ArrowRight'||ev.key==='ArrowLeft'){ev.stopPropagation();}
    });
  });
}

    (L==='es'?s[1]:s[2])+' <a href="'+s[3]+'" target="_blank" rel="noopener">↗</a></li>';}).join('')
    +'<li style="color:var(--soft);font-size:11.5px">'+t('tierFoot')+'</li>';
  document.getElementById('coverage').innerHTML='<h3 style="font-family:var(--f);font-weight:600;font-size:17px;margin:0 0 10px">'+t('coverH')+'</h3><div class="grid">'+
    COVERAGE.map(function(c){
      const lab=c[1]===3?t('complete'):c[1]===2?t('partial'):t('open');
      const col=c[1]===3?'#40695a':c[1]===2?'#b8862b':'#a4552f';
      return '<div class="mini"><b>'+c[0].split('|')[L==='es'?0:1]+'</b><span style="display:block;color:'+col+';font-weight:700;letter-spacing:.6px;text-transform:uppercase;font-size:9.5px;margin:3px 0">'+lab+'</span><span>'+(L==='es'?c[2]:c[3])+'</span></div>';}).join('')+
    '</div><p class="meta" style="margin-top:12px">'+t('coverFoot')+'</p>';
  drawWheel();detail();drawNames();drawBridges();calc();
}
document.getElementById('lang').addEventListener('click',function(){
  L=(L==='es'?'en':'es'); try{localStorage.setItem('cq-lang',L);}catch(e){} render();});
document.getElementById('date').addEventListener('change',calc);
document.getElementById('go').addEventListener('click',calc);
document.getElementById('today').addEventListener('click',function(){
  document.getElementById('date').value=gtToday();calc();});
document.getElementById('share').addEventListener('click',function(){
  const v=document.getElementById('date').value;if(!v)return;
  const p=v.split('-').map(Number),s=signOf(p[0],p[1],p[2]),day=DAYS[s.idx],f=F(day);
  const url=location.protocol.indexOf('http')===0?' '+location.href:'';
  const txt=s.num+' '+day.kiche+' — '+KW[L][s.idx]+'. '+f.force+" (Cholq'ij, GMT 584283)"+url;
  const out=document.getElementById('shareOut');
  const say=function(m){if(out)out.textContent=m;};
  if(navigator.share){navigator.share({text:txt}).then(function(){say('');}).catch(function(){say(t('shareFail'));});}
  else if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){say(t('shareOk'));}).catch(function(){say(t('shareFail'));});
  } else { say(t('shareFail')); }
});
document.addEventListener('keydown',function(e){
  if(!document.getElementById('v-wheel').classList.contains('on'))return;
  if(e.key==='ArrowRight'){sel=(sel+1)%20;drawWheel();detail();}
  if(e.key==='ArrowLeft'){sel=(sel+19)%20;drawWheel();detail();}});
(function(){
  const m=/(?:[?&]d=)(\d{4}-\d{2}-\d{2})/.exec(location.search);
  document.getElementById('date').value=(m&&/^\d{4}-\d{2}-\d{2}$/.test(m[1]))?m[1]:gtToday();
  render();
})();
</script>
</body>
